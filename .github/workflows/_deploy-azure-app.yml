name: Deploy Azure app

on:
  workflow_call:
    inputs:
      target_tag:
        description: Docker image tag used by the target environment
        required: false
        type: string
        default: latest
    secrets:
      acr_login_server:
        required: true
      acr_name:
        required: true
      azure_client_id:
        required: true
      azure_resource_group:
        required: true
      azure_subscription_id:
        required: true
      azure_tenant_id:
        required: true
      azure_webapp_name:
        required: true
      image_name:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.target_tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        if: ${{ inputs.target_tag == 'latest' }}
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: Log in to Azure Container Registry
        shell: bash
        run: az acr login --name "${{ secrets.acr_name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: ${{ inputs.target_tag == 'latest' }}
        shell: bash
        run: |
          set -euo pipefail

          image="${{ secrets.acr_login_server }}/${{ secrets.image_name }}"

          docker buildx build \
            --file Dockerfile \
            --tag "${image}:latest" \
            --push \
            .

      - name: Promote existing image
        if: ${{ inputs.target_tag != 'latest' }}
        shell: bash
        run: |
          set -euo pipefail

          image="${{ secrets.acr_login_server }}/${{ secrets.image_name }}"
          target_tag="${{ inputs.target_tag }}"

          if [[ -z "$target_tag" ]]; then
            echo "target_tag is required for promotion." >&2
            exit 1
          fi

          source_tag="promotion"
          tags=(--tag "${image}:${target_tag}")

          if [[ "$target_tag" == "demo" ]]; then
            source_tag="latest"
            tags+=(--tag "${image}:promotion")
          fi

          if ! docker buildx imagetools inspect "${image}:${source_tag}" >/dev/null; then
            echo "Missing ${image}:${source_tag}. Deploy the source environment before promoting it." >&2
            exit 1
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "${image}:${source_tag}"

      - name: Restart Azure App Service
        shell: bash
        run: |
          set -euo pipefail

          az webapp restart \
            --resource-group "${{ secrets.azure_resource_group }}" \
            --name "${{ secrets.azure_webapp_name }}"
