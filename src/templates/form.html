{% extends "base.html" %}

{% block content %}

    <form
      method="post"
      action="{% if object %}{% url view.url_names.edit object.pk %}{% else %}{% url view.url_names.create %}{% endif %}"
      class="flex flex-col gap-4">
      {% csrf_token %}

      {{ formset }}

      <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url view.url_names.list %}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
